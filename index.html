<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Roguelite</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="start-screen">
        <h2 style="color: #666; margin-bottom: 20px; font-family: monospace;">SYSTEM READY</h2>
        <button id="start-btn">TAP TO ENTER FULLSCREEN</button>
    </div>

    <div id="rotate-message">
        <div class="rotate-icon">📱 ⤵️</div>
        <h2>PLEASE ROTATE DEVICE</h2>
        <p>Landscape mode required</p>
    </div>

    <script type="module" src="src/main.js"></script>

    <!-- ИСПРАВЛЕННЫЙ СКРИПТ ВХОДА -->
    <script>
        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');

        startBtn.addEventListener('click', () => {
            // 1. СРАЗУ скрываем кнопку. Не ждем ни секунды.
            startScreen.style.display = 'none';

            // 2. Запускаем полный экран (без await)
            const docEl = document.documentElement;
            if (docEl.requestFullscreen) {
                docEl.requestFullscreen().catch(err => console.log("FS Error:", err));
            } else if (docEl.webkitRequestFullscreen) {
                docEl.webkitRequestFullscreen(); // Для Айфонов
            }

            // 3. Блокируем ориентацию (если можно)
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock("landscape").catch(() => {});
            }
        });
    </script>

    <!-- ОСТАВЛЯЕМ КОНСОЛЬ ОШИБОК (Она не мешает) -->
    <div id="debug-console" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 50%; background: rgba(0,0,0,0.9); color: #ff5555; z-index: 99999; font-family: monospace; font-size: 12px; padding: 10px; overflow: scroll; pointer-events: auto;">
        <button onclick="this.parentNode.style.display='none'" style="float: right; font-size: 20px;">❌</button>
        <h3>DEBUG CONSOLE</h3>
    </div>

    <script>
        function logError(title, detail) {
            const consoleDiv = document.getElementById('debug-console');
            consoleDiv.style.display = 'block';
            consoleDiv.innerHTML += `<div style="border-bottom: 1px solid #555; margin-bottom: 10px;"><strong>${title}</strong><br>${detail}</div>`;
        }
        window.onerror = function(message, source, lineno, colno, error) {
            let stack = error ? error.stack : 'No stack';
            logError("JS ERROR", `${message}<br>File: ${source}:${lineno}<br><pre>${stack}</pre>`);
        };
        window.addEventListener('unhandledrejection', (event) => {
            logError("PROMISE REJECTION", `<pre>${event.reason ? event.reason.stack : event.reason}</pre>`);
        });
    </script>
</body>
</html>
